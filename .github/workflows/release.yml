name: release

# Push a tag vX.Y.Z to build a draft release. A maintainer reviews the
# draft and publishes it by hand.
#
# Trust boundary, enforced by repository settings, not by this file:
# - The "Release tags: admins only" tag ruleset lets only repository
#   admins create, move, or delete v* tags.
# - The "release" environment accepts only v* tags and requires a
#   maintainer to approve each run before it gets the write token.
# The ancestry check below also refuses a tag that is not on main.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  draft:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Refuse a tag that is not on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "error: $GITHUB_REF_NAME points to $GITHUB_SHA, which is not on main" >&2
            exit 1
          fi
      - name: Build release files
        run: python3 scripts/build-release.py "$GITHUB_REF_NAME"
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          prerelease=""
          case "$version" in 0.*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --draft $prerelease \
            --title "me.md protocol $version" \
            --notes-file dist/release-notes.md \
            "dist/me.md-protocol-$version.md"
