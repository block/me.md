name: hosts

on:
  pull_request:
    paths:
      - "hosts/**"
      - "conformance/**"
      - "tools/**"
      - ".github/workflows/hosts.yml"
  push:
    branches: [main]
    paths:
      - "hosts/**"
      - "conformance/**"
      - "tools/**"
      - ".github/workflows/hosts.yml"

permissions:
  contents: read

jobs:
  python-host:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.x"]
        include:
          # The oldest Python the host supports. ubuntu-latest has no 3.9 build.
          - os: ubuntu-24.04
            python: "3.9"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest discover -s hosts/python/tests -p 'test_*.py'
      - name: Conformance runner
        run: python conformance/runner/thou_conform.py --host "python hosts/python/thou_driver.py"

  node-host:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ["24"]
        include:
          # The oldest Node the host supports.
          - os: ubuntu-latest
            node: "22"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"
      - name: Unit tests
        run: node --test hosts/node/test/
      - name: Conformance runner
        run: python conformance/runner/thou_conform.py --host "node hosts/node/thou-driver.mjs"
      - name: Conformance runner, with thou-py as the second host
        run: >-
          python conformance/runner/thou_conform.py --host "node hosts/node/thou-driver.mjs"
          --second-host "python hosts/python/thou_driver.py"
      - name: Experiment 0009 script, both orders
        # Steps 4b and 5b each fail for one of the two hosts (see the experiment). The job fails only if the
        # script crashes or steps 1 to 5a fail.
        run: |
          for pair in "node hosts/node/thou-driver.mjs|python hosts/python/thou_driver.py" \
                      "python hosts/python/thou_driver.py|node hosts/node/thou-driver.mjs"; do
            python experiments/0009-serve-one-store-from-two-hosts.py --a "${pair%%|*}" --b "${pair##*|}" > out.md || true
            grep -q '^## 5b' out.md
            if grep -E '^## (1|2|3|4|5a)\. .*FAIL$' out.md; then exit 1; fi
          done

  runner:
    # The runner's own tests: a fake host passes, and each deliberate bug in it is caught.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.9"
      - name: Runner tests
        run: python -m unittest discover -s conformance/runner -p 'test_*.py'
